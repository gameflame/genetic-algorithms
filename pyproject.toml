[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cp468-genetic-algorithms"
version = "0.1.0"
description = "A modular genetic algorithm framework for benchmark optimization."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5"]

[tool.setuptools.packages.find]
include = ["ga", "ga.*"]
